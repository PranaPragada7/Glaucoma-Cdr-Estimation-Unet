[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "glaucoma-cdr-unet"
version = "1.0.0"
description = "U-Net optic disc/cup segmentation and vertical CDR estimation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "Pillow>=10,<13",
    "tensorflow>=2.16,<3",
]

[project.optional-dependencies]
dev = [
    "black>=25,<27",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
]

[project.scripts]
glaucoma-cdr = "glaucoma_cdr.cli:main"

[tool.setuptools.packages.find]
include = ["glaucoma_cdr*"]

[tool.black]
extend-exclude = "notebooks"
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
addopts = "--cov=glaucoma_cdr --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
markers = [
    "integration: loads TensorFlow and the committed model weights",
]

[tool.ruff]
extend-exclude = ["notebooks"]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
]
skip_covered = true
